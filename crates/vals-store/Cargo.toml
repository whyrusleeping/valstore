[package]
name = "vals-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-fixtures = []
heap-profile = []

[dependencies]
vals-rt = { path = "../vals-rt" }
vals-spdk = { path = "../vals-spdk" }
# Facade for the one info-level log a large-device format emits (mirrors the
# cluster's `wipe_region`); a multi-second format must be visible, never silent.
log = "0.4"
# Inline small vectors for the staged point-read probes (task 0104): a cold key's
# candidate-block locators (and each locator's covered-segment LBAs) stay
# allocation-free on the hot Apply/BatchApply resolve path.
smallvec = "1"
libc = "0.2"
# Run format v7 compresses each run data block (task 0564): zstd level 1 left
# 29% of real run block bytes against 43% for LZ4, and nothing hand-written
# gets near its entropy coding of base32 DIDs and record keys.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
backtrace = "0.3"
