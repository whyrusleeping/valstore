name: Software CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal -c clippy -c rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run locked software lane
        run: scripts/ci.sh
      - name: Retain software CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-ci-logs
          path: target/ci-logs/
          if-no-files-found: warn

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal -c clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build every target
        run: cargo build --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Runtime, engine, raft and client tests
        run: cargo test --locked -p vals-rt -p vals-store -p vals-raft -p vals-client
