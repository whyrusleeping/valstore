[workspace]
resolver = "2"
members = [
    "crates/vals-rt",
    "crates/vals-spdk",
    "crates/vals-store",
    "crates/vals-raft",
    "crates/vals-client",
    "crates/vals-cluster",
    "crates/vals-bench",
    "crates/vals-server",
]
exclude = ["vendor"]

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/whyrusleeping/valstore"

# raft-proto with its protobuf code checked in: the crates.io build script
# needs a protoc 3.x, which macOS on Apple Silicon lacks (vendor/raft-proto).
[patch.crates-io]
raft-proto = { path = "vendor/raft-proto" }

# Build the engine in release for any IOPS-sensitive measurement.
[profile.release]
lto = "thin"
codegen-units = 1
